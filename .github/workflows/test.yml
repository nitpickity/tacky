name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - name: Run tests
        run: cargo test --workspace
      # `cargo test` does not build bench or example targets, so a broken benchmark
      # would pass CI. `--all-targets` type-checks them without running anything.
      - name: Check benches and examples
        run: cargo check --workspace --all-targets
      # Every bench asserts that prost decodes back what tacky wrote, for compatibility, so run those checks
      - name: Run benchmark correctness checks
        run: cargo bench -p testing -- --test
