[package]
name = "tacky-build"
version = "0.2.0"
edition = "2021"
description = "Build-time .proto code generation for tacky. Emits zero-sized schema structs and per-message field enums."
repository = "https://github.com/nitpickity/tacky"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
pb-rs = { path = "../pbrs" }
heck = "0.5"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full"] }
prettyplease = "0.2"
