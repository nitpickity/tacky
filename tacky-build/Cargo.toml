[package]
name = "tacky-build"
version = "0.2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Used only by the vendored `.proto` parser in `src/pbrs`.
nom = "7"
heck = "0.5"
quote = "1.0"
proc-macro2 = "1.0"
syn = { version = "2.0", features = ["full"] }
prettyplease = "0.2"
